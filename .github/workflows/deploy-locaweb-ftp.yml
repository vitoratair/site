# Deploy automático para a Locaweb (FTP), conforme documentação "Publicar via Git".
# Secrets no GitHub (Settings → Secrets → Actions): HOST, USER, PASS — dados do painel Arquivos e FTP.
# https://www.locaweb.com.br/ajuda/wiki/github-actions-ftp-hospedagem-compartilhada-locaweb/
name: Deploy to Locaweb (FTP)

on:
  push:
    branches:
      - main
      - current
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: dist
          remoteDir: public_html
